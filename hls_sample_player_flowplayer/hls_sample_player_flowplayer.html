<!DOCTYPE HTML>
<html>
<head>
<title>HLS Sample Player Flowplayer</title>
<script type="text/javascript" src="flowplayer-3.2.12.min.js"></script>
<script type="text/javascript" src="flowplayer.ipad-3.2.12.min.js"></script>
</head>

<body>
<!-- player container-->
<a style="display: block; width: 660px; height: 350px;" id="flashlsPlayer">
</a>

<!-- Flowplayer installation and configuration -->
    <script>
        flowplayer("flashlsPlayer", "flowplayer.swf", {
            plugins: {
                flashls: {
                    url: 'flashlsFlowPlayer.swf' // Flashls plugin SWF
                },
				plugins: {
					httpstreaming: {
						url: 'flashlsFlowPlayer.swf'
					}
				}
            },
            clip: {
                url: "https://rtvelivestream.rtve.es/rne_r1_main.m3u8", // HLS audio URL
				ipadUrl: "https://rtvelivestream.rtve.es/rne_r1_main.m3u8",
                autoPlay: false,
 				urlResolvers: ["httpstreaming","brselect"],
				provider: "httpstreaming",
			},
            providers: {
                httpstreaming: {
                    url: 'flashlsFlowPlayer.swf', // Ensure the Flashls plugin is properly linked
                    autoPlay: false
                }
            }
        }).ipad(); // Enable iPad support if necessary
    </script>
	
<p>

</p>

</body>
</html>
